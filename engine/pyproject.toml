[project]
name = "wordlegym"
version = "0.1.0"
description = "Wordle strategy research engine for standard, evil, and hidden-mode environments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
